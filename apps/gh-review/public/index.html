<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Review queue</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="/queue.css" />
  <script>
    // Set the theme before the first paint so a light-mode reload doesn't flash dark.
    try { document.documentElement.dataset.theme = localStorage.getItem('theme') ?? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'); } catch {}
  </script>
</head>
<body>
  <header>
    <span class="count"><b id="count"></b><span>waiting</span></span>
    <label class="filter"><input id="search" placeholder="Filter, or paste a PR link to import" spellcheck="false" autocomplete="off" /><button id="import" type="button" hidden>Import</button><kbd>/</kbd></label>
    <nav id="sorts" class="seg"></nav>
    <button id="direct" class="ghost" title="Only PRs that asked you by name  d">Asked me</button>
    <span class="right">
      <span id="fetched"></span>
      <a class="ghost" href="/mine" title="Your own open PRs, in their own list  m">My PRs</a>
      <button id="notify" class="ghost" title="Desktop notification when someone asks for your review"></button>
      <button id="side" class="ghost" title="Move panel  [ ]"></button>
      <button id="theme" class="ghost" title="Theme  t"></button>
    </span>
  </header>
  <div id="body">
    <main id="list" role="listbox" aria-label="pull requests waiting on your review" aria-multiselectable="true"></main>
    <aside id="rail"></aside>
  </div>
  <footer><span id="status"></span><span id="keys"></span></footer>
  <script src="/app.js" type="module"></script>
</body>
</html>
