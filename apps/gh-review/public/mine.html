<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My PRs</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="/queue.css" />
  <script>
    try { document.documentElement.dataset.theme = localStorage.getItem('theme') ?? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'); } catch {}
  </script>
</head>
<body class="mine">
  <header>
    <span class="count"><b id="count"></b><span>open</span></span>
    <label class="filter"><input id="search" placeholder="Filter your PRs" spellcheck="false" autocomplete="off" /><kbd>/</kbd></label>
    <a class="ghost" href="/" title="The PRs waiting on your review  q">Review queue</a>
    <span class="right">
      <span id="fetched"></span>
      <button id="theme" class="ghost" title="Theme  t"></button>
    </span>
  </header>
  <div id="body">
    <main id="list" role="listbox" aria-label="your open pull requests"></main>
    <aside id="rail"></aside>
  </div>
  <footer><span id="status"></span><span id="keys"></span></footer>
  <script src="/mine.js" type="module"></script>
</body>
</html>
